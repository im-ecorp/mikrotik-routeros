name: Build and Push MikroTik Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'RouterOS Version (e.g. 7.21.4)'
        required: true
        default: '7.21.4'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Lowercase the repo owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROUTEROS_VERSION=${{ github.event.inputs.version }}
          tags: |
            hossein3piol/mikrotik-routeros:v${{ github.event.inputs.version }}
            hossein3piol/mikrotik-routeros:${{ github.event.inputs.version }}
            ghcr.io/${{ env.OWNER }}/mikrotik-routeros:v${{ github.event.inputs.version }}
            ghcr.io/${{ env.OWNER }}/mikrotik-routeros:${{ github.event.inputs.version }}
