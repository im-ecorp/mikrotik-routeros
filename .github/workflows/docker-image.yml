name: Build and Push MikroTik Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'RouterOS Version (e.g. 7.21.4)'
        required: true
        default: '7.21.4'
      tag_latest:
        description: 'Also tag this version as latest?'
        required: true
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Lowercase the repo owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Generate tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.version }}"
          OWNER="${OWNER}"

          TAGS="hossein3piol/mikrotik-routeros:v${VERSION},hossein3piol/mikrotik-routeros:${VERSION},ghcr.io/${OWNER}/mikrotik-routeros:v${VERSION},ghcr.io/${OWNER}/mikrotik-routeros:${VERSION}"

          if [ "${{ github.event.inputs.tag_latest }}" = "true" ]; then
            TAGS="${TAGS},hossein3piol/mikrotik-routeros:latest,ghcr.io/${OWNER}/mikrotik-routeros:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROUTEROS_VERSION=${{ github.event.inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
