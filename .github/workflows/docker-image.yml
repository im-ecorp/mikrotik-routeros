name: Publish CHR image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Internal wrapper metadata X.Y.Z; not a public image version'
        required: true
        type: string
        default: '1.0.0'
      approve_version_overwrite:
        description: 'Explicitly approve replacing existing CHR version aliases (never SHA tags)'
        required: true
        type: boolean
        default: false
      routeros_version:
        description: 'RouterOS seed version; must match the tested Dockerfile default'
        required: true
        type: string
        default: '7.21.4'

permissions:
  contents: read

concurrency:
  group: chr-image-publication
  cancel-in-progress: false

env:
  APPROVE_VERSION_OVERWRITE: ${{ inputs.approve_version_overwrite }}
  RELEASE_VERSION: ${{ inputs.release_version }}
  ROUTEROS_VERSION: ${{ inputs.routeros_version }}
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  SOURCE_URL: https://github.com/im-ecorp/mikrotik-routeros
  DOCKERHUB_IMAGE: hossein3piol/mikrotik-routeros
  GHCR_IMAGE: ghcr.io/im-ecorp/mikrotik-routeros

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'im-ecorp/mikrotik-routeros'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      image_tag: ${{ steps.policy.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dispatch policy
        id: policy
        shell: python
        run: |
          # BEGIN RELEASE POLICY
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.image_release import validate_inputs
          import os
          import re
          if __name__ == '__main__':
              tested_seed = re.search(r'^ARG ROUTEROS_VERSION=(\S+)$', Path('Dockerfile').read_text(), re.M).group(1)
              tags = validate_inputs(os.environ['RELEASE_VERSION'], os.environ['ROUTEROS_VERSION'],
                                     os.environ['SOURCE_REF'], os.environ['SOURCE_SHA'], tested_seed)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'image_tag={tags[0]}\n')
          # END RELEASE POLICY
      - name: Require successful main CI on this exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          # BEGIN GATE POLICY
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.image_release import require_run, require_job, require_ci
          import os
          if __name__ == '__main__':
              require_ci(os.environ['SOURCE_SHA'])
          # END GATE POLICY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-compose-action@v1
        with:
          version: v5.5.1
      - name: Validate source again before publishing
        env:
          REQUIRE_COMPOSE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          for script in bin/*.sh bin/qemu-ifup bin/qemu-ifdown; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Check immutable SHA and approved CHR aliases
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/image_release.py preflight
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish validated CHR aliases and immutable SHA tags
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            ROUTEROS_VERSION=${{ env.ROUTEROS_VERSION }}
            WRAPPER_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_REVISION=${{ env.SOURCE_SHA }}
            SOURCE_URL=${{ env.SOURCE_URL }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_IMAGE }}:v${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:v${{ env.IMAGE_TAG }}
      - name: Read back every published reference and unchanged latest
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/image_release.py readback
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
